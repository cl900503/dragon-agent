# ============================================================
# Dragon Agent 应用基础配置（所有 Profile 共享）
# ============================================================

server:
  port: 8080

spring:
  application:
    name: agent

  config:
    import:
      - optional:classpath:config/ai.properties

  ai:
    deepseek:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL}
      chat:
        options:
          model: ${AI_MODEL}
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

# CORS 允许的前端域名，逗号分隔，支持环境变量覆盖
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  auth:
    token-secret: ${AUTH_TOKEN_SECRET:dragon-agent-default-secret-change-in-production}

# Actuator 健康检查——仅暴露 health 端点
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# 全局日志格式和默认级别
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.dragon: DEBUG
    org.springframework.security: WARN
    org.springframework.ai: DEBUG
