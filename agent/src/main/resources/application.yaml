# ============================================================
# Dragon Agent 应用基础配置（所有 Profile 共享）
# ============================================================

server:
  port: 8080

spring:
  application:
    name: agent

  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration

  # 响应式 multipart 文件上传配置
  codec:
    max-in-memory-size: 20MB
  webflux:
    multipart:
      max-parts: 10
      max-disk-usage-per-part: 20MB
      max-headers-size: 8KB

  config:
    import:
      - optional:classpath:config/ai.properties

  ai:
    deepseek:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL}
      chat:
        options:
          model: ${AI_MODEL}
    # Milvus 向量存储（BGE-M3 embedding dim = 1024）
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
          database: ${MILVUS_DATABASE:default}
        embedding-dimension: 1024
        collection-name: ${MILVUS_COLLECTION:vector_store}
        initialize-schema: false
    # OpenAI Embedding 客户端（硅基流动 BGE-M3 API）
    openai:
      api-key: ${BGE_API_KEY}
      base-url: https://api.siliconflow.cn/v1
      embedding:
        options:
          model: BAAI/bge-m3
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

# CORS 允许的前端域名，逗号分隔，支持环境变量覆盖
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  auth:
    token-secret: ${AUTH_TOKEN_SECRET:}

  # MinIO 对象存储
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:dragon-agent}
  # 文件上传限制
  upload:
    max-file-size: 20MB
    allowed-mime-types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - text/plain
      - text/markdown
      - text/x-java-source
      - text/x-python
      - text/x-c
      - text/csv
      - application/json
  # RAG 检索参数
  bge-m3:
    url: http://localhost:8081/embed
  rag:
    # 查询改写专用模型（轻量快速）
    rewrite-model: deepseek-v4-flash
    chunk-size: 512
    chunk-overlap: 50
    top-k: 5
    # BGE-M3 语义 Embedding，分数范围 0.3-0.8
    similarity-threshold: 0.2
    # 语义分块开关
    semantic-chunking: true
    # 检索候选数（各路召回 Top100 → RRF → Top30，TEI 最大批量 32）
    search-limit: 30
  # Reranker 参数
  rerank:
    base-url: http://localhost:8082
    top-k: 5          # 最终送入 LLM 的数量
    ce-top-k: 10      # Cross-Encoder 输出数量（送入 MMR）
    # MMR 多样性重排
    mmr-enabled: true
    mmr-lambda: 0.7
  # 检索缓存
  cache:
    embedding:
      max-size: 1000
      ttl-minutes: 30
    search:
      max-size: 500
      ttl-minutes: 5

# Actuator 健康检查——仅暴露 health 端点
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# 全局日志格式和默认级别
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.dragon: DEBUG
    org.springframework.security: WARN
    org.springframework.ai: DEBUG
