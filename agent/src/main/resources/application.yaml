# ============================================================
# Dragon Agent 应用配置
# ============================================================

server:
  port: 8080

spring:
  application:
    name: agent

  config:
    import:
      - optional:classpath:config/ai.properties

  ai:
    deepseek:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL}
      chat:
        options:
          model: ${AI_MODEL}

# Actuator 健康检查——仅暴露 health 端点
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
